dataset: customers
owner: CRM Engineering Team 
consumer: Downstream Analytics & BI Reporting Layer
source_type: csv
primary_key: customer_id
delivery:
  cadence: Daily batch snapshot or static load
fields:
  - name: customer_id
    type: str
    nullable: false
    unique: true
  - name: first_name
    type: str
    nullable: true
  - name: last_name
    type: str
    nullable: true
  - name: email
    type: str
    nullable: true
  - name: city
    type: str
    nullable: true
  - name: signup_date
    type: timestamp
    nullable: false
  - name: customer_segment
    type: str
    nullable: false
nullability & uniqueness expectations: ('customer_id') must be strictly unique and non-null.
quality_rules:
  - Primary key uniqueness check on customer_id
  - Non-null assertion on mandatory fields ('customer_id', 'signup_date')
  - Format validation regex on email
  - Exact row deduplication filter
  - Domain validation for ('customer_segment') values
change_policy:
  schema_change_notice: automated CI/CD pipeline alert triggered via Slack/Email if a column is dropped or modified
escalation contact: Data Engineering on-call
ingestion approach & justification: Full file copy via pandas CSV reader paired with SHA-256 hash tracking. The dataset size is small (250 records), and full snapshots ensure baseline state alignment without complex incremental state management overhead.

